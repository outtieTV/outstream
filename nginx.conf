user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid  /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

rtmp {
    server {
        listen 1935;
        chunk_size 8192;

        ping 30s;
        notify_method get;
        max_streams 128;

        # Binary MIME type only for RTMPâ€‘related files
        #default_type application/octet-stream;

        application live {
            live on;

            # LOW LATENCY / STABILITY
            wait_key   on;
            sync       100ms;
            interleave on;

            # ACCESS CONTROL
            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            allow publish 10.0.0.19;
            deny  publish all;

            allow play all;

            # HLS
            hls               on;
            hls_path          /var/www/hls;
            hls_fragment      1s;          # 1â€‘second segments
            hls_playlist_length 120s;      # 2â€¯min DVR
            hls_continuous    on;
            hls_cleanup       off;
            hls_nested        on;
            hls_fragment_naming sequential;

            # RECORDING
            record            all;
            record_path       /var/www/vod;
            record_suffix     _archive_%Y-%m-%d_%H-%M-%S.flv;
            record_unique     off;
            record_interval   2h;
            record_notify     off;

            # DASH (optional modern streaming)
            dash          on;
            dash_path     /var/www/dash;
            dash_fragment 1s;
            dash_playlist_length 20s;
        }
    }
}

http {
    include       mime.types;
    default_type  text/html;               # <â€‘â€‘ HTML for any static file fallback
    server_tokens off;

    sendfile        on;
    aio             threads;
    directio        512;

    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout 30;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_max_body_size 64M;
    types_hash_max_size 4096;

    # GZIP
    gzip                on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/vnd.apple.mpegurl;

    # FASTCGI common params (kept for reuse)
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param QUERY_STRING    $query_string;
    fastcgi_param REQUEST_METHOD  $request_method;
    fastcgi_param CONTENT_TYPE    $content_type;
    fastcgi_param CONTENT_LENGTH  $content_length;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR     $remote_addr;
    fastcgi_param REMOTE_PORT     $remote_port;
    fastcgi_param SERVER_ADDR     $server_addr;
    fastcgi_param SERVER_PORT     $server_port;
    fastcgi_param SERVER_NAME     $server_name;
    fastcgi_param HTTPS           $https if_not_empty;

	server {

		listen 9090;

		server_name _;

		root /var/www/html;

		index index.php index.html;

		charset utf-8;

		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Referrer-Policy no-referrer-when-downgrade always;

		location /vods/ {
			try_files $uri $uri/ /vods/index.php?$query_string;
		}

		location /clips/ {
			try_files $uri $uri/ /clips/index.php?$query_string;
		}

		location /vod/ {

			alias /var/www/vod/;

			autoindex on;
			autoindex_exact_size off;
			autoindex_localtime on;

			types {
				video/x-flv flv;
				video/mp4 mp4;
			}

			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		location /clip/ {

			alias /var/www/clip/;

			autoindex on;
			autoindex_exact_size off;
			autoindex_localtime on;

			types {
				video/mp4 mp4;
				video/x-flv flv;
			}

			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		location /hls/ {

			alias /var/www/hls/;

			types {
				application/vnd.apple.mpegurl m3u8;
				video/mp2t ts;
			}

			add_header Cache-Control no-cache;
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		location /dash/ {

			alias /var/www/dash/;

			types {
				application/dash+xml mpd;
				video/mp4 mp4;
			}

			add_header Access-Control-Allow-Origin *;
		}

		location ~ \.php$ {

			try_files $uri =404;

			include fastcgi_params;

			fastcgi_pass unix:/run/php/php8.4-fpm.sock;

			fastcgi_read_timeout 300;
			fastcgi_send_timeout 300;

			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		location / {
			try_files $uri $uri/ /index.php?$query_string;
		}
	}
}
