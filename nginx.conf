user  www-data;

worker_processes  auto;
pid                /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# --------------------------------------------------------------
# RTMP SERVER (FLV OUTPUT)
# --------------------------------------------------------------
rtmp {
    server {
        listen       1935;
        chunk_size   4096;

        application live {
            live on;

            record               all;
            record_path          /var/www/vod/;
            record_suffix        _archive_%Y-%m-%d_%H-%M-%S.flv;
            record_unique        off;
            record_interval      2h;

            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            allow publish 10.0.0.19;
            deny  publish all;

            allow play   all;

            # HLS ENABLED (Converts RTMP live stream to HTTP HLS files on the fly)


            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_continuous on;
            hls_cleanup on;
            hls_fragment_naming sequential;

            # Timestamp sync
            sync 100ms;
        }
    }
}

# --------------------------------------------------------------
# HTTP SERVER
# --------------------------------------------------------------
http {
    include       mime.types;
    default_type  text/html;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    # -----------------------------------------------------------------
    # Global FastCGI (PHP-FPM) parameters â€“ shared by every php block
    # -----------------------------------------------------------------
    fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD      $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;
    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;
    fastcgi_param  HTTPS             $https if_not_empty;

    server {
        listen       9090;
        server_name  10.0.0.65;

        # Set the global web root for this entire server block
        root /var/www/html;
        index index.php index.html;

        # --------------------------------------------------------------
        # PHP-FPM handling
        # --------------------------------------------------------------
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # --------------------------------------------------
        # HLS Video Delivery (Kept separate from web root)
        # --------------------------------------------------
        location /hls/ {
            alias /var/www/hls/;

            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                      ts;
            }

            add_header Cache-Control                     no-cache;
            add_header Access-Control-Allow-Origin       *;
            add_header Access-Control-Allow-Headers      *;
            add_header Access-Control-Allow-Methods      'GET, HEAD, OPTIONS';
            expires -1;
        }

        # --------------------------------------------------
        # VOD FLV (Now targeting /var/www/html/vod/)
        # --------------------------------------------------
        location /vod/ {
            # Inherits 'root /var/www/html' from the server block.
            # Looking for /vod/ will resolve to /var/www/html/vod/

            types { video/x-flv flv; }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Accept-Ranges bytes;

            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # /vod (no trailing slash) â†’ redirect to /vod/
        location = /vod {
            return 301 /vod/;
        }

        # --------------------------------------------------
        # Fallback / Default routing
        # --------------------------------------------------
        location / {
            # This will naturally serve /var/www/html/index.php if it exists.
            # If the file doesn't exist, it falls back to this message string.
            try_files $uri $uri/ =200 "NGINX RTMP FLV VOD SERVER RUNNING\n";
        }
    }
}
