user www-data;
worker_processes auto;

pid /run/nginx.pid;

# IMPORTANT:
# Commented out because nginx was custom compiled with modules built-in.
# Leaving this enabled can cause duplicate-module crashes.
#
# include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

# =========================================================================
# RTMP
# =========================================================================
rtmp {

    server {

        listen 1935;
        chunk_size 4000;

        application live {

            live on;
            record off;

            # Stream authentication
            on_publish http://127.0.0.1:9090/auth.php;

            # =========================================================
            # HLS
            # =========================================================
            hls on;

            hls_path /var/www/hls;

            hls_nested on;

            hls_fragment 2s;
            hls_playlist_length 6s;

            # =========================================================
            # DASH
            # =========================================================
            dash on;

            dash_path /var/www/dash;

            dash_fragment 2s;
            dash_playlist_length 6s;
        }
    }
}

# =========================================================================
# HTTP
# =========================================================================
http {

    # =========================================================
    # BASIC
    # =========================================================
    sendfile on;
    tcp_nopush on;

    types_hash_max_size 2048;

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    # =========================================================
    # SSL
    # =========================================================
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # =========================================================
    # LOGGING
    # =========================================================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # =========================================================
    # GZIP
    # =========================================================
    gzip on;

    # =========================================================
    # SERVER
    # =========================================================
    server {

        listen 9090;

        server_name localhost;

        root /var/www/html;

        index index.php index.html index.htm;

        # =====================================================
        # BLOCK SENSITIVE JSON FILES
        # =====================================================

        location = /auth.json {
            return 403;
        }

        location = /metadata.json {
            return 403;
        }

        # =====================================================
        # MAIN SITE
        # =====================================================

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # =====================================================
        # VODS
        # =====================================================

        location /vods/ {
            try_files $uri $uri/ /vods/index.php?$query_string;
        }

        # =====================================================
        # CLIPS
        # =====================================================

        location /clips/ {
            try_files $uri $uri/ /clips/index.php?$query_string;
        }

        # =====================================================
        # HLS
        # =====================================================

        location /hls/ {

            alias /var/www/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Accept-Ranges bytes;

            expires -1;

            sendfile on;
        }

        # =====================================================
        # DASH
        # =====================================================

        location /dash/ {

            alias /var/www/dash/;

            types {
                application/dash+xml mpd;
                video/mp4 mp4;
            }

            add_header Access-Control-Allow-Origin *;
        }

        # =====================================================
        # PHP
        # =====================================================

        location ~ \.php$ {

            try_files $uri =404;

            include fastcgi_params;

            fastcgi_pass 127.0.0.1:9000;

            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # =====================================================
        # SECURITY
        # =====================================================

        # Block hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
