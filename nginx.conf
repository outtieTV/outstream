# -------------------------------------------------
#  Main nginx configuration
# -------------------------------------------------
user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid  /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

# =========================================================
# RTMP
# =========================================================

rtmp {

    server {

        listen 1935;

        chunk_size 8192;

        ping 30s;

        notify_method get;

        max_streams 128;

        application live {

            live on;

            # =========================================
            # LOW LATENCY
            # =========================================

            wait_key on;

            sync 100ms;

            interleave on;

            # =========================================
            # ACCESS CONTROL
            # =========================================

            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            allow publish 10.0.0.19;

            deny publish all;

            allow play all;

            # =========================================
            # HLS
            # =========================================

            hls on;

            hls_path /var/www/hls;

            hls_fragment 1s;

            hls_playlist_length 6s;

            hls_continuous on;

            hls_cleanup on;

            hls_nested on;

            hls_fragment_naming sequential;

            # =========================================
            # RECORDING
            # =========================================

            record all;

            record_path /var/www/vod;

            record_suffix _archive_%Y-%m-%d_%H-%M-%S.flv;

            record_unique off;

            record_interval 2h;

            record_notify off;

            # =========================================
            # AUTO CONVERT FLV -> MP4
            # =========================================

            exec_record_done /var/www/convert_vod.sh $path;

            # =========================================
            # DASH
            # =========================================

            dash on;

            dash_path /var/www/dash;

            dash_fragment 1s;

            dash_playlist_length 6s;
        }
    }
}

# =========================================================
#  HTTP (Web site) ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“ default_type = text/html
# =========================================================
http {
    include       mime.types;
    default_type  text/html;               # <ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ËœÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Ëœ HTML for any static file fallback
    server_tokens off;

    # -------------------------------------------------
    # Core performance / security settings
    # -------------------------------------------------
    sendfile        on;
    aio             threads;
    directio        512;

    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout 30;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_max_body_size 64M;
    types_hash_max_size 4096;

    # GZIP
    gzip                on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/vnd.apple.mpegurl;

    # FASTCGI common params (kept for reuse)
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param QUERY_STRING    $query_string;
    fastcgi_param REQUEST_METHOD  $request_method;
    fastcgi_param CONTENT_TYPE    $content_type;
    fastcgi_param CONTENT_LENGTH  $content_length;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR     $remote_addr;
    fastcgi_param REMOTE_PORT     $remote_port;
    fastcgi_param SERVER_ADDR     $server_addr;
    fastcgi_param SERVER_PORT     $server_port;
    fastcgi_param SERVER_NAME     $server_name;
    fastcgi_param HTTPS           $https if_not_empty;

    # -------------------------------------------------
    #  Main site ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“ listens on 9090
    # -------------------------------------------------
	server {

		listen 9090;

		server_name _;

		root /var/www/html;

		index index.php index.html;

		charset utf-8;

		# -------------------------------------------------
		# SECURITY HEADERS
		# -------------------------------------------------

		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options SAMEORIGIN always;
		add_header Referrer-Policy no-referrer-when-downgrade always;

		# =================================================
		# VODS WEB PAGE
		# /var/www/html/vods/index.php
		# =================================================

		location /vods/ {
			try_files $uri $uri/ /vods/index.php?$query_string;
		}

		# =================================================
		# CLIPS WEB PAGE
		# /var/www/html/clips/index.php
		# =================================================

		location /clips/ {
			try_files $uri $uri/ /clips/index.php?$query_string;
		}

		# =================================================
		# RAW VOD FILES
		# URL: /vod/filename.flv
		# PATH: /var/www/vod/filename.flv
		# =================================================

		location /vod/ {

			alias /var/www/vod/;

			autoindex on;
			autoindex_exact_size off;
			autoindex_localtime on;

			types {
				video/x-flv flv;
				video/mp4 mp4;
			}

			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		# =================================================
		# RAW CLIP FILES
		# URL: /clip/filename.mp4
		# PATH: /var/www/clip/filename.mp4
		# =================================================

		location /clip/ {

			alias /var/www/clip/;

			autoindex on;
			autoindex_exact_size off;
			autoindex_localtime on;

			types {
				video/mp4 mp4;
				video/x-flv flv;
			}

			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		# =================================================
		# HLS
		# URL: /hls/stream/index.m3u8
		# PATH: /var/www/hls/stream/index.m3u8
		# =================================================

		location /hls/ {

			alias /var/www/hls/;

			types {
				application/vnd.apple.mpegurl m3u8;
				video/mp2t ts;
			}

			add_header Cache-Control no-cache;
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;

			sendfile on;
		}

		# =================================================
		# DASH
		# =================================================

		location /dash/ {

			alias /var/www/dash/;

			types {
				application/dash+xml mpd;
				video/mp4 mp4;
			}

			add_header Access-Control-Allow-Origin *;
		}

		# =================================================
		# PHP
		# =================================================

		location ~ \.php$ {

			try_files $uri =404;

			include fastcgi_params;

			fastcgi_pass unix:/run/php/php8.4-fpm.sock;

			fastcgi_read_timeout 300;
			fastcgi_send_timeout 300;

			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		# =================================================
		# DEFAULT FALLBACK
		# =================================================

		location / {
			try_files $uri $uri/ /index.php?$query_string;
		}
	}
}
