user  www-data;

worker_processes  auto;
pid                /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# --------------------------------------------------------------
# RTMP SERVER (FLV OUTPUT)
# --------------------------------------------------------------
rtmp {
    server {
        listen       1935;
        chunk_size   4096;

        application live {
            live on;

            record               all;
            record_path          /var/www/vod/;
            record_suffix        _archive_%Y-%m-%d_%H-%M-%S.flv;
            record_unique        off;
            record_interval      2h;

            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            allow publish 10.0.0.19;
            deny  publish all;

            allow play   all;

            # HLS ENABLED (Converts RTMP live stream to HTTP HLS files on the fly)


            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_continuous on;
            hls_cleanup on;
            hls_fragment_naming sequential;

            # Timestamp sync
            sync 100ms;
        }
    }
}

# --------------------------------------------------------------
# HTTP SERVER
# --------------------------------------------------------------
http {
    include       mime.types;
    default_type  text/html;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    # -----------------------------------------------------------------
    # Global FastCGI (PHP-FPM) parameters Ã¢â‚¬â€œ shared by every php block
    # -----------------------------------------------------------------
    fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD      $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;
    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;
    fastcgi_param  HTTPS             $https if_not_empty;

	server {
		listen       9090;
		server_name  10.0.0.65;

		# main web root â€“ used for normal pages, PHP, etc.
		root /var/www/html;
		index index.php index.html;

		################################################################
		#  /vod/  â€“ webâ€‘visible directory with its own index page
		################################################################
		location /vod/ {
			# Serve the *index* page from the webâ€‘root directory
			index index.php;

			# The directory that actually holds the FLV files
			alias /var/www/vod/;          # <-- note the trailing slash

			# MIME type for FLV files
			types { video/x-flv flv; }

			# CORS / range headers (keep what you already have)
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
			add_header Accept-Ranges bytes;

			# Optional directory listing for the *alias* directory
			autoindex on;
			autoindex_exact_size off;
			autoindex_localtime on;
		}

		# -----------------------------------------------------------------
		#  /vod (no trailing slash) â†’ redirect to /vod/
		# -----------------------------------------------------------------
		location = /vod {
			return 301 /vod/;
		}

		################################################################
		#  PHP handling (unchanged)
		################################################################
		location ~ \.php$ {
			try_files $uri =404;
			fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
			include        fastcgi_params;
			fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		################################################################
		#  Default fallback
		################################################################
		location / {
			try_files $uri $uri/ =200 "NGINX RTMP FLV VOD SERVER RUNNING\n";
		}
	}

}
