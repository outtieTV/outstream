user  www-data;

worker_processes  auto;
pid                /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# --------------------------------------------------------------
# RTMP SERVER (FLV OUTPUT)
# --------------------------------------------------------------
rtmp {
    server {
        listen       1935;
        chunk_size   4096;

        application live {
            live on;

            # ---------------- FLV RECORDING ----------------
            record               all;
            record_path          /var/www/vod/;
            record_suffix        _archive_%Y%m%d_%H%M%S.flv;
            record_unique        off;
            record_interval      10s;

            # ---------------- ACCESS CONTROL ----------------
            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            allow publish 10.0.0.19;
            deny  publish all;

            allow play   all;
        }
    }
}

# --------------------------------------------------------------
# HTTP SERVER
# --------------------------------------------------------------
http {
    include       mime.types;

    ## 1ï¸âƒ£  Fixed default type â€“ fallback to HTML instead of binary
    # default_type  application/octet-stream;   # â† removed
    default_type  text/html;                    # optional explicit fallback

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    ## 2ï¸âƒ£  FastCGI (PHPâ€‘FPM) parameters â€“ shared for all PHP locations
    fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD     $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;
    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;
    fastcgi_param  HTTPS              $https if_not_empty;

    server {
        listen       9090;
        server_name  10.0.0.65;

        # --------------------------------------------------
        # HLS (unchanged, separate system)
        # --------------------------------------------------
        location /hls/ {
            alias /var/www/hls/;

            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
            }

            add_header Cache-Control                     no-cache;
            add_header Access-Control-Allow-Origin       *;
            add_header Access-Control-Allow-Headers      *;
            add_header Access-Control-Allow-Methods      'GET, HEAD, OPTIONS';

            expires -1;
        }

        # --------------------------------------------------
        # VOD FLV (fixed MIME handling)
        # --------------------------------------------------
    location /vod/ {
        root /var/www;

        index index.php index.html;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        types {
            video/x-flv flv;
        }

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        add_header Accept-Ranges bytes;

        # IMPORTANT: ensure PHP files are executed if accessed via /vod/
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
        # --------------------------------------------------
        # PHPâ€‘FPM (PHPâ€¯8.4) handling
        # --------------------------------------------------
        location ~ \.php$ {
            # Serve the file if it exists, otherwise 404
            try_files $uri =404;

            # PHPâ€‘FPM socket â€“ replace the version if your distro ships a different one
            fastcgi_pass   unix:/run/php/php8.4-fpm.sock;   # â† PHPâ€¯8.4â€¯FPM
            # If you prefer a TCP socket, use:
            # fastcgi_pass  127.0.0.1:9000;

            include        fastcgi_params;   # pulls in most fastcgi_param lines above
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # --------------------------------------------------
        # simple test root
        # --------------------------------------------------
        location / {
            return 200 "NGINX RTMP FLV VOD SERVER RUNNING\n";
        }
    }
}
