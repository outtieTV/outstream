user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

# =========================================================================
# RTMP Configuration
# =========================================================================
rtmp {
	server {
		listen 1935;
		chunk_size 4000;

		# Single application block handling all streams dynamically.
		# Streamers use paths like "gaming/my_key" to auto-categorize.
		application live {
			live on;
			record off;

			# Crucial: Sends a POST request to your PHP script before allowing publication
			on_publish http://127.0.0.1:9090/auth.php;

			# =============================================
			# HLS
			# =============================================
			hls on;
			hls_path /var/www/hls;
			
			# CRITICAL: Dynamically mirrors subfolders on disk 
			# matching the category layout (e.g., /var/www/hls/gaming/my_key/)
			hls_nested on;
			
			hls_fragment 2s;
			hls_playlist_length 6s;

			# =============================================
			# DASH
			# =============================================
			dash on;
			dash_path /var/www/dash;
			dash_fragment 2s;
			dash_playlist_length 6s;
		}
	}
}

# =========================================================================
# HTTP Configuration
# =========================================================================
http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# =====================================================================
	# Custom Streaming Server Configuration
	# =====================================================================
	server {
		listen 9090;
		server_name localhost;

		# Web Application Root
		location / {
			root /var/www/html;
			index index.php index.html index.htm;
		}

		# =================================================
		# HLS Native Consumption Endpoint
		# =================================================
		location /hls/ {
			alias /var/www/hls/;

			types {
				application/vnd.apple.mpegurl m3u8;
				video/mp2t ts;
			}

			add_header Cache-Control no-cache;
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Headers *;
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';

			add_header Accept-Ranges bytes;

			expires -1;
			sendfile on;
		}

		# =================================================
		# DASH Native Consumption Endpoint
		# =================================================
		location /dash/ {
			alias /var/www/dash/;

			types {
				application/dash+xml mpd;
				video/mp4 mp4;
			}

			add_header Access-Control-Allow-Origin *;
		}

		# =================================================
		# PHP-FPM Processor Link
		# =================================================
		location ~ \.php$ {
			root /var/www/html;
			try_files $uri =404;

			include fastcgi_params;

			# Adjusted point-to target to default standard 127.0.0.1:9000 loopback
			# Update this line to matching Unix socket path if system uses it instead!
			fastcgi_pass 127.0.0.1:9000;
			
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}
	}
}
