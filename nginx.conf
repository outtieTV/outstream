user www-data;
# --------------------------------------------------------------
# Global settings
# --------------------------------------------------------------
worker_processes  auto;
pid               /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# --------------------------------------------------------------
# RTMP module configuration
# --------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # ----------------------------------------------------------------
        #  Live application – HLS + VOD recording
        # ----------------------------------------------------------------
        application live {
            # Enable live streaming
            live on;

            # ------- Recording ------------------------------------------------
            # Record the entire stream (audio + video) to the VOD folder.
            record           all;
            record_path      /var/www/vod/;                # absolute path, writable by nginx user
            record_suffix    _archive_%Y%m%d_%H%M%S.mp4;   # timestamped filename
            record_unique    off;                         # use our suffix, not random hash
            record_interval  10s;                          # rotate file every 5 min (optional but useful)

            # ------- Publishing permissions ------------------------------------
            allow publish 127.0.0.1;        # local machine
            allow publish 10.0.0.33;      # your OBS box
	    allow publish 10.0.0.19;
            deny  publish all;            # block everyone else

            # ------- Playback permissions --------------------------------------
            allow play all;

            # ------- HLS (live‑to‑HLS) -----------------------------------------
            hls               on;
            hls_path          /var/www/hls;
            hls_fragment      2s;
            hls_playlist_length 10s;
            hls_continuous    on;
            hls_cleanup       on;
            hls_fragment_naming sequential;

            # ------- Timestamp sync --------------------------------------------
            sync 100ms;
        }
    }
}

# --------------------------------------------------------------
# HTTP server – HLS playback, VOD files, test page, simple player
# --------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ---- Kaltura VOD cache (keeps HLS slicing fast) ----
    vod_metadata_cache  metadata_cache 512m;
    vod_response_cache  response_cache 128m;

    server {
        listen       9090;
        server_name  localhost;

        # ----------------------------------------------------------
        # Live HLS output (e.g. http://host:9090/hls/stream.m3u8)
        # ----------------------------------------------------------
        location /hls {
            alias /var/www/hls/;
            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                      ts;
            }

            # CORS & cache control for live playback
            add_header Cache-Control                no-cache;
            add_header Access-Control-Allow-Origin  '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range';
            expires -1;
            autoindex on;
        }

        # ----------------------------------------------------------
        # Video‑on‑Demand (recorded .flv files)
        # ----------------------------------------------------------
        location /vod {
            alias /var/www/vod/;          # matches the record_path above
            autoindex on;                 # directory listing for quick testing

            # Serve VOD via HLS if client requests .m3u8 (optional)
            vod hls;
            vod_mode local;

            # CORS headers
            add_header Access-Control-Allow-Origin  '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Expose-Headers  'Server,range,Content-Length,Content-Range';
        }

        # ----------------------------------------------------------
        # Simple web player (static HTML page)
        # ----------------------------------------------------------
        location /player {
            alias /var/www/;      # expects index.html inside /var/www
            index index.html;
        }

        # ----------------------------------------------------------
        # Root test page
        # ----------------------------------------------------------
        location / {
            default_type text/plain;
            return 200 "NGINX RTMP + HLS + VOD Server Running\n";
        }
    }
}
