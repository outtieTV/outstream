worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            # Enable live streaming
            live on;

            # Disable recording
            record off;

            # Publishing permissions (Only allow streaming from localhost and your OBS machine)
            allow publish 127.0.0.1;
            allow publish 10.0.0.33;
            deny publish all;

            # Playback permissions
            allow play all;

            # HLS ENABLED (Converts RTMP live stream to HTTP HLS files on the fly)
            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_continuous on;
            hls_cleanup on;
            hls_fragment_naming sequential;

            # Timestamp sync
            sync 100ms;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # FIXED: Shared memory allocation required by Kaltura VOD module 
    # to prevent worker processes from hanging during HLS slicing.
    vod_metadata_cache metadata_cache 512m;
    vod_response_cache response_cache 128m;

    server {
        listen 9090;
        server_name localhost;

        # --------------------------------------------------------------
        # LIVE HLS STREAM OUTPUT (For playing back live stream via HTTP)
        # --------------------------------------------------------------
        location /hls {
            alias /var/www/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            # FIXED: Bulletproof CORS and Cache Control for Live HLS playback
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range';

            expires -1;
            autoindex on;
        }

        # --------------------------------------------------------------
        # VIDEO ON DEMAND (For streaming local MP4 files dropped in /var/www/vod/)
        # --------------------------------------------------------------
        location /vod {
            vod hls;
            vod_mode local;
            alias /var/www/vod/;

            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range';
        }

        # --------------------------------------------------------------
        # WEB PLAYER
        # --------------------------------------------------------------
        location /player {
            # FIXED: Changed from 'root /var/www' to 'alias' so Nginx 
            # points directly to /var/www/index.html instead of looking for /var/www/player/
            alias /var/www/;
            index index.html;
        }

        # --------------------------------------------------------------
        # ROOT TEST PAGE
        # --------------------------------------------------------------
        location / {
            default_type text/plain;
            return 200 "NGINX RTMP + HLS + VOD Server Running\n";
        }
    }
}
